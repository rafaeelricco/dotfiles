<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taste capture fixture</title>
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
      }
      main {
        display: block;
      }
      .hero {
        height: 700px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background-image: radial-gradient(87% 87% at 50% 9%, #fff0 41%, #fff 72%), url(sky.svg);
        background-size: cover;
        background-position: center;
      }
      .hero h1 {
        margin: 0;
        color: #fff;
        font-size: 56px;
        line-height: 1.1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        color: #fff;
        text-decoration: none;
        background:
          radial-gradient(101% 101% at 65% 81%, #fff9 0, #fff0 100%),
          radial-gradient(114% 114% at 9% 17%, #1e82e0 0, #1c38ea 100%);
      }
      /* one picture in two elements on one box, as a site's light and dark copies: one ground */
      .window {
        position: relative;
        height: 500px;
      }
      .window img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #panels {
        padding: 96px 40px;
      }
      #panels h2 {
        margin: 0 0 32px;
        font-size: 40px;
        width: fit-content;
        background-image: linear-gradient(90deg, #19191d, #626275);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .panel {
        width: 600px;
        height: 400px;
        border-radius: 20px;
        background-image: radial-gradient(92% 126% at 50% 100%, #dde2ee 59%, #bbc5dd 100%);
      }
      #panels p {
        max-width: 600px;
        margin: 32px 0 0;
        color: #111;
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>A sky worth recording</h1>
        <a class="btn" href="#panels">Get started</a>
      </section>
      <section class="window">
        <img src="sky.svg" alt="" />
        <img src="sky.svg" alt="" />
      </section>
      <section id="panels">
        <h2>Panels that keep their gradients</h2>
        <div class="panel"></div>
        <p>
          The capture should keep the gradients behind the flat colours, not only their average, and the picture under
          the hero.
        </p>
      </section>
    </main>
  </body>
</html>
