# Include this snippet inside the r1cco.com server block. It only claims the
# dotfiles and skill URL prefixes; all existing application roots remain intact.

location ^~ /dotfiles/releases/ {
    alias /var/www/r1cco.com/dotfiles/releases/;
    autoindex off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /dotfiles {
    return 301 /dotfiles/;
}

location ^~ /dotfiles/ {
    alias /var/www/r1cco.com/dotfiles/current/;
    default_type text/plain;
    autoindex off;
    expires off;
    add_header Cache-Control "no-store" always;
}

location ^~ /skills/ {
    alias /var/www/r1cco.com/dotfiles/current/skills/;
    default_type text/plain;
    autoindex off;
    expires off;
    add_header Cache-Control "no-store" always;
}
