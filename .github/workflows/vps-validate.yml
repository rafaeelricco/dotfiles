name: VPS Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vps-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: r1cco-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release bundle for verification
        run: python scripts/package_release.py --version "$GITHUB_SHA" --output "$RUNNER_TEMP/dotfiles-release"
      - name: Verify the bundle and Linux installer
        env:
          DOTFILES_TEST_RELEASE_DIR: ${{ runner.temp }}/dotfiles-release
        run: python -m unittest discover -s tests
